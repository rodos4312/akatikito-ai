<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 170" width="920" height="170" role="img" aria-label="Akatikito 5-step getting started flow">
  <rect width="920" height="170" rx="14" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="26" width="154" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="97" y="56" fill="#38bdf8" font-size="18" font-weight="700">1</text>
    <text x="97" y="84" fill="#f8fafc" font-size="14" font-weight="600">Download ZIP</text>
    <text x="97" y="106" fill="#94a3b8" font-size="12">Κατέβασμα ZIP</text>
    <text x="97" y="128" fill="#64748b" font-size="11">No Python needed</text>

    <path d="M180 85 L196 85" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="202" y="26" width="154" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="279" y="56" fill="#38bdf8" font-size="18" font-weight="700">2</text>
    <text x="279" y="84" fill="#f8fafc" font-size="14" font-weight="600">Extract All</text>
    <text x="279" y="106" fill="#94a3b8" font-size="12">Αποσυμπίεση</text>
    <text x="279" y="128" fill="#64748b" font-size="11">Right-click → Extract</text>

    <path d="M362 85 L378 85" stroke="#38bdf8" stroke-width="2.5"/>

    <rect x="384" y="26" width="154" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="461" y="56" fill="#38bdf8" font-size="18" font-weight="700">3</text>
    <text x="461" y="84" fill="#f8fafc" font-size="14" font-weight="600">Open App</text>
    <text x="461" y="106" fill="#94a3b8" font-size="12">AkatikitoApp.cmd</text>
    <text x="461" y="128" fill="#64748b" font-size="11">Double-click</text>

    <path d="M544 85 L560 85" stroke="#38bdf8" stroke-width="2.5"/>

    <rect x="566" y="26" width="154" height="118" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="643" y="56" fill="#38bdf8" font-size="18" font-weight="700">4</text>
    <text x="643" y="84" fill="#f8fafc" font-size="14" font-weight="600">Connect AI</text>
    <text x="643" y="106" fill="#94a3b8" font-size="12">Cloud or Local</text>
    <text x="643" y="128" fill="#64748b" font-size="11">Guided 2-choice setup</text>

    <path d="M726 85 L742 85" stroke="#22c55e" stroke-width="2.5"/>

    <rect x="748" y="26" width="152" height="118" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="824" y="56" fill="#4ade80" font-size="18" font-weight="700">5</text>
    <text x="824" y="84" fill="#f8fafc" font-size="14" font-weight="600">Ask Anything</text>
    <text x="824" y="106" fill="#bbf7d0" font-size="12">Πρώτη ερώτηση</text>
    <text x="824" y="128" fill="#86efac" font-size="11">3 one-click examples</text>
