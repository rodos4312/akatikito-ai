name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Fast Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Run unified fast quality checks
        env:
          PYTHONUTF8: "1"
        run: python scripts/check.py --fast

  tests:
    name: Tests (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-features.txt -r requirements-dev.txt

      - name: Install template parser dependencies
        working-directory: akatikito/template_parsers
        run: npm ci --no-audit --no-fund

      - name: Run Python test suite
        env:
          PYTHONUTF8: "1"
        run: python scripts/check.py --only pytest --ci

      - name: Run 10-scenario offline eval harness
        env:
          PYTHONUTF8: "1"
        run: python scripts/run_evals.py

      - name: Clean-install Doctor health check
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import json, subprocess, sys; r = subprocess.run([sys.executable, '-m', 'akatikito.doctor', '--json'], capture_output=True, text=True, encoding='utf-8'); d = json.loads(r.stdout); errs = [c for c in d['checks'] if c['status'] == 'error']; print('Doctor:', d['badge'], d['counts']); sys.exit(1 if errs else 0)"

  supply-chain:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Python dependencies (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt -r requirements-features.txt --progress-spinner off
