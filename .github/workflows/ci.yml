name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install -r requirements-features.txt
          pip install -r requirements-dev.txt

      - name: Unified fast quality checks (ruff, size, health, JS, node UI)
        run: python scripts/check.py --fast

      - name: Security audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-features.txt --progress-spinner off

      - name: Install template parser dependencies
        working-directory: akatikito/template_parsers
        run: npm.cmd ci --no-audit --no-fund

      - name: Run Python test suites
        run: python scripts/check.py --only pytest --ci

      - name: Run 10-scenario offline eval harness
        run: python scripts/run_evals.py

      - name: Clean-install Doctor health check
        env:
          PYTHONUTF8: "1"
        run: |
          python -c "import json, subprocess, sys; r = subprocess.run([sys.executable, '-m', 'akatikito.doctor', '--json'], capture_output=True, text=True, encoding='utf-8'); d = json.loads(r.stdout); errs = [c for c in d['checks'] if c['status'] == 'error']; print('Doctor:', d['badge'], d['counts']); sys.exit(1 if errs else 0)"
