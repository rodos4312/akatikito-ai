name: Release Portable Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Portable Release (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build zero-Python portable ZIP & SHA256SUMS
        env:
          PYTHONUTF8: "1"
        run: python packaging/build_portable.py

      - name: Verify ZIP integrity & clean-install boot
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\Akatikito-*-portable.zip | Select-Object -First 1).FullName
          python scripts/release_check.py --verify-zip "$zip" --sums dist/SHA256SUMS.txt
          ./scripts/clean_install_check.ps1 -OldZip "$zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem dist\Akatikito-*-portable.zip | Select-Object -First 1).FullName
          gh release create "$tag" "$zip" dist/SHA256SUMS.txt --title "Akatikito $tag" --generate-notes --latest
