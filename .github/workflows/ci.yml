name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
          pip install -r requirements-features.txt
          pip install -r requirements-dev.txt

      - name: Ruff (undefined names, syntax)
        run: ruff check --select F821,F811,E9,F63,F7 --isolated akatikito scripts tests app.py

      - name: Install template parser dependencies
        working-directory: akatikito/template_parsers
        run: npm.cmd ci --no-audit --no-fund

      - name: Validate UI JavaScript & Node UI tests
        run: |
          Get-ChildItem akatikito\ui\*.js, akatikito\onboarding.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          Get-ChildItem tests\*.cjs | ForEach-Object { node $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }

      - name: Run Python test suites
        run: pytest -k "not real_chromium" -q -p no:cacheprovider

      - name: Run 10-scenario offline eval harness
        run: python scripts/run_evals.py
